name : CI
on:
  pull_request:
    branches: [main,dev]
  push:
    branches: [main,dev]
jobs:
  build:  
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nasflix_test
        ports:
          - 5432:5432
  
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '25.2.1'

    - name: Install dependencies
      run: npm install

    - name: generate Prisma client
      run: npx prisma generate
      
    - name: Build project
      run: npm run build
    
    - name: Run tests
      run: npm test

    - name: Lint code
      run:  npm run lint