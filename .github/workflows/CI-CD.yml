name : CI
on:
  pull_request:
    branches: [main]
jobs:
  build:  
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '25.2.1'

    - name: Install dependencies
      run: npm install

    - name: generate Prisma client
      run: npx prisma generate
      
    - name: Build project
      run: npm run build
    
    - name: Run tests
      run: npm test

    - name: Lint code
      run:  npm run lint